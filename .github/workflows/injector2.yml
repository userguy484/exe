name: build-injector2

on:
  push:
    paths:
      - 'injector2.cpp'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: compile
        shell: cmd
        run: |
          g++ -O2 -static -o injector2.exe injector2.cpp -lkernel32 -luser32

      - name: upload exe
        uses: actions/upload-artifact@v4
        with:
          name: injector2
          path: injector2.exe
