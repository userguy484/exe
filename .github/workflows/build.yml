name: build-cpp

on:
  push:
    paths:
      - '.github/workflows/main.cpp'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: compile
        shell: cmd
        run: |
          g++ -O2 -static -o injector.exe .github/workflows/main.cpp -lkernel32 -luser32

      - name: upload exe
        uses: actions/upload-artifact@v4
        with:
          name: injector
          path: injector.exe
