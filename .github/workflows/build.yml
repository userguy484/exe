name: build-cpp

on:
  push:
    paths:
      - '.github/workflows/main.cpp'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: compile
        shell: cmd
        run: |
          g++ -O2 -shared -static-libgcc -static-libstdc++ -o executor.dll .github/workflows/main.cpp -lkernel32 -luser32

      - name: upload dll
        uses: actions/upload-artifact@v4
        with:
          name: executor
          path: executor.dll
