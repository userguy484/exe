name: build-cpp

on:
  push:
    paths:
      - 'main.cpp'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: compile
        shell: cmd
        run: |
          g++ -O2 -static -o program.exe main.cpp

      - name: upload exe
        uses: actions/upload-artifact@v4
        with:
          name: program
          path: program.exe
